name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  branch-name:
    name: Branch Name Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feature|fix|docs|chore|refactor|test)/"
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::Branch name '$BRANCH' does not match required pattern."
            echo "Branch names must start with: feature/, fix/, docs/, chore/, refactor/, or test/"
            exit 1
          fi
          echo "Branch name '$BRANCH' is valid."

  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # One shell on every runner: PowerShell splits -flag=value.ext
        # arguments and go test then looks for a package named ".out".
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # The tests create repositories and commit LF fixtures; the runner's
      # global autocrlf would report them modified for no change of theirs.
      - name: Git line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # Which git and bash the runner offers decides the shell metis picks
      # for configured commands; the log says which it was.
      - name: Shell on this runner
        if: runner.os == 'Windows'
        run: where.exe git bash || true

      - name: Installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          "scripts/install.ps1 parses"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== Coverage by package ==="
          go tool cover -func=coverage.out | grep -v "0.0%"
          echo ""
          go tool cover -func=coverage.out | grep total

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          install-mode: goinstall

  coverage:
    name: Coverage Badge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Generate coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage check and badge
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          local-prefix: github.com/techspeque/metis
          threshold-total: 50
          badge-file-name: coverage.svg
          git-branch: badges
          git-token: ${{ secrets.GITHUB_TOKEN }}
